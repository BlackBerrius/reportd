services:
  sqlite-perms:
    image: alpine:3.24
    user: "0"
    volumes:
      - reportd-sqlite:/data
    command: ["chown", "1001:1001", "/data"]

  reportd:
    image: ${REPORTD_IMAGE:-ghcr.io/blackberrius/reportd:latest}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      REPORTD_DATABASE_URL: sqlite:///data/reportd.db
      REPORTD_PROJECT: ${REPORTD_PROJECT:-local}
      REPORTD_DATASET: ${REPORTD_DATASET:-local}
      REPORTD_ANALYTICS_TABLE: ${REPORTD_ANALYTICS_TABLE:-analytics}
      REPORTD_REPORTS_TABLE: ${REPORTD_REPORTS_TABLE:-reports}
      REPORTD_REPORTS_V2_TABLE: ${REPORTD_REPORTS_V2_TABLE:-reporting}
    volumes:
      - reportd-sqlite:/data
    depends_on:
      sqlite-perms:
        condition: service_completed_successfully

volumes:
  reportd-sqlite:
